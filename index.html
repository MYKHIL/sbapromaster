<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/png" href="./images/logo1.png" />
  <title>SBA Pro Master</title>

  <style>
    @keyframes fadeInScale {
      from {
        transform: scale(0.95);
        opacity: 0;
      }

      to {
        transform: scale(1);
        opacity: 1;
      }
    }

    .animate-fade-in-scale {
      animation: fadeInScale 0.2s ease-out forwards;
    }

    /* --- Date Picker Styles --- */
    /* Ensure the date picker calendar popup has a light theme (white background) */
    input[type="date"] {
      color-scheme: light;
    }

    /* Style to make the calendar icon more visible */
    input[type="date"]::-webkit-calendar-picker-indicator {
      cursor: pointer;
      opacity: 0.8;
      transition: opacity 0.2s;
    }

    input[type="date"]::-webkit-calendar-picker-indicator:hover {
      opacity: 1;
    }

    /* --- Hide scrollbars but allow scrolling --- */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }

    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    /* Loading screen styles */
    .loading-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      gap: 12px;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
      color: #1f2937;
      text-align: center;
      padding: 20px;
      box-sizing: border-box;
    }

    .loading-container .logo {
      width: 96px;
      height: auto;
      border-radius: 12px;
      box-shadow: 0 8px 30px rgba(31,41,55,0.12);
      background: white;
    }

    .app-title {
      margin: 0;
      font-size: 24px;
      font-weight: 700;
      color: #0f172a;
      letter-spacing: -0.5px;
    }

    .loading-subtitle {
      margin: 0;
      color: #475569;
      font-size: 14px;
    }

    .loading-visual { margin: 8px 0 4px; }

    .spinner {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      border: 4px solid rgba(0,0,0,0.08);
      border-top-color: #3b82f6;
      animation: spin 1s linear infinite;
      box-shadow: 0 6px 18px rgba(59,130,246,0.12);
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .creator { margin: 6px 0 0; color: #374151; font-size: 13px; }
    .creator a { color: #2563eb; text-decoration: none; }
    .creator a:hover { text-decoration: underline; }

    .connection-note { margin: 4px 0 0; color: #6b7280; font-size: 12px; }
  </style>


  <script>
    window.addEventListener('error', function (e) {
      var message = e.message || 'Unknown error';
      var source = e.filename || 'Unknown source';
      var lineno = e.lineno || 0;

      // Ignore resize observer errors which are common and harmless
      if (message.includes('ResizeObserver loop')) return;

      // Removed filter for 'Script error.' to debug loading issues
      // if (message === 'Script error.' || (message === 'Unknown error' && source.includes('Unknown source'))) return;

      var errorDiv = document.getElementById('global-error-display');
      if (!errorDiv) {
        errorDiv = document.createElement('div');
        errorDiv.id = 'global-error-display';
        errorDiv.style.position = 'fixed';
        errorDiv.style.top = '0';
        errorDiv.style.left = '0';
        errorDiv.style.width = '100%';
        errorDiv.style.backgroundColor = '#ffcccc';
        errorDiv.style.color = '#cc0000';
        errorDiv.style.padding = '20px';
        errorDiv.style.zIndex = '99999';
        errorDiv.style.fontFamily = 'monospace';
        errorDiv.style.whiteSpace = 'pre-wrap';
        document.body.appendChild(errorDiv);
      }
      // Append browser and page info to help debug cross-browser differences
      var userAgent = navigator.userAgent || 'Unknown UA';
      var pageUrl = window.location.href || 'Unknown URL';
      errorDiv.innerHTML += 'Error: ' + message + '\nSource: ' + source + ':' + lineno + '\nUA: ' + userAgent + '\nURL: ' + pageUrl + '\n\n';
    }, true); // Capture phase to catch resource load errors
  </script>
</head>

<body class="bg-gray-100">
  <div id="root">
    <div class="loading-container" role="status" aria-live="polite">
      <img src="images/logo1.png" alt="SBA Pro Master logo" class="logo" />
      <h1 class="app-title">SBA Pro Master</h1>
      <p class="loading-subtitle">Initializing system — please wait</p>

      <div class="loading-visual">
        <div class="spinner" aria-hidden="true"></div>
      </div>

      <p class="creator">Created by <strong>Mr. Michael Darko</strong> (<a href="tel:0542410613">0542410613</a>)</p>
      <p class="connection-note">If loading takes longer than 30 seconds, check your internet connection or contact the creator.</p>
    </div>
  </div>
  <!--
    Note: `crossorigin="anonymous"` enables browsers to surface real stack traces
    for errors originating from this module when the resource and its source map
    are served with proper CORS headers (Access-Control-Allow-Origin).
    See CORS_AND_SOURCE_MAPS.md for server/CDN configuration instructions.
  -->
  <script type="module" src="./index.tsx" crossorigin="anonymous"></script>
</body>

</html>
